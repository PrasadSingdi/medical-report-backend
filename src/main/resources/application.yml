server:
  port: ${PORT:8080}
  servlet:
    context-path: /apex-diagnostics
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:diagnostics;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
    # For PostgreSQL after database setup, use the PostgreSQL URL, credentials and driver.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
# JWT configuration remains disabled until authentication is implemented.
# app:
#   jwt-secret: ${JWT_SECRET}
#   jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
logging:
  config: classpath:log4j2-spring.xml
