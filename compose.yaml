services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medical-report-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reports"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reports
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  medical-report-data:
